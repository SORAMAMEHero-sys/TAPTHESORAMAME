<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- Viewportによるズーム防止 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ラーメン屋経営ゲーム</title>
    <style>
        /* CSSによるタップ・ズーム・選択防止 */
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            overscroll-behavior: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #d32f2f;
            margin-top: 0;
        }

        .status-panel {
            background: #fff8e1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ffe082;
        }

        .status-item {
            font-size: 16px;
            margin: 8px 0;
            font-weight: bold;
            color: #333;
        }

        .staff-icons {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ffd54f;
            font-size: 15px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
            color: #444;
            border-left: 4px solid #d32f2f;
            padding-left: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-buy {
            background-color: #ff9800;
            color: white;
        }

        .btn-buy:hover:not(:disabled) {
            background-color: #f57c00;
        }

        .btn-upgrade {
            background-color: #4caf50;
            color: white;
        }

        .btn-upgrade:hover:not(:disabled) {
            background-color: #388e3c;
        }

        .btn-system {
            background-color: #0288d1;
            color: white;
        }

        .btn-system:hover:not(:disabled) {
            background-color: #01579b;
        }

        .btn-reset {
            background-color: #757575;
            color: white;
        }

        .btn-reset:hover:not(:disabled) {
            background-color: #616161;
        }

        .log-panel {
            background: #212121;
            color: #4caf50;
            font-family: monospace;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            border-radius: 6px;
            font-size: 13px;
            touch-action: pan-y;
        }

        .system-btn-group {
            display: flex;
            gap: 10px;
        }

        .system-btn-group button {
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍜 ラーメン屋経営</h1>

    <div class="status-panel">
        <div class="status-item">所持金（売上）: <span id="money">1,000</span> 円</div>
        <div class="status-item">評価: <span id="eval">50</span> / 100</div>
        <div class="status-item">在庫ラーメン: <span id="stock">0</span> 杯</div>
        <div class="status-item">待ち客数: 👥 × <span id="customers">0</span></div>
        <div class="status-item">回転速度: 1客 / <span id="speed">7.0</span> 秒</div>
        
        <div class="staff-icons">
            🧑‍🔧×<span id="partTimeCount">0</span> 
            🙋‍♀️×<span id="waitressCount">0</span> 
            😎×<span id="youtuberCount">0</span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">仕入れ</div>
        <button class="btn-buy" id="btnBuyRamen">ラーメン購入 (500円)</button>
    </div>

    <div class="section">
        <div class="section-title">強化メニュー</div>
        <button class="btn-upgrade" id="btnBuyPartTime">バイト (1,000円) - 売上1.3倍</button>
        <button class="btn-upgrade" id="btnBuyWaitress">看板娘 (2,000円) - 回転率0.2秒短縮 [上限25]</button>
        <button class="btn-upgrade" id="btnBuyYoutuber">YouTuber (20,000円) - 売上3倍</button>
    </div>

    <div class="section">
        <div class="section-title">システム</div>
        <div class="system-btn-group">
            <button class="btn-system" id="btnManualSave">手動セーブ</button>
            <button class="btn-reset" id="btnConfirmReset">データを削除してリセット</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">運営ログ</div>
        <div class="log-panel" id="log"></div>
    </div>
</div>

<script>
    // ズーム徹底ガード処理
    document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchstart', function (e) {
        if (e.touches.length > 1) {
            e.preventDefault();
        }
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            e.preventDefault();
        }
        lastTouchEnd = now;
    }, false);

    document.addEventListener('wheel', function (e) {
        if (e.ctrlKey) {
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
            e.preventDefault();
        }
    });

    // ゲーム初期設定
    const SAVE_KEY = 'ramen_shop_save_data';
    const INITIAL_STATE = {
        money: 1000,
        evaluation: 50,
        stock: 0,
        customers: 0,
        partTime: 0,
        waitress: 0,
        youtuber: 0,
        basePrice: 1050,
        baseSpeed: 7.0
    };

    let state = { ...INITIAL_STATE };
    let gameLoopTimer = null;

    // セーブ処理
    function saveGame(showLog = false) {
        try {
            localStorage.setItem(SAVE_KEY, JSON.stringify(state));
            if (showLog) log('データを保存しました。');
        } catch (e) {
            console.error('セーブに失敗しました', e);
        }
    }

    // ロード処理
    function loadGame() {
        try {
            const savedData = localStorage.getItem(SAVE_KEY);
            if (savedData) {
                state = { ...INITIAL_STATE, ...JSON.parse(savedData) };
                log('保存されたデータを読み込みました。');
                return true;
            }
        } catch (e) {
            console.error('ロードに失敗しました', e);
        }
        return false;
    }

    // セーブデータ削除
    function clearSave() {
        localStorage.removeItem(SAVE_KEY);
    }

    // 手動セーブ用ボタン
    function manualSave() {
        saveGame(true);
    }

    // リセット確認ボタン
    function confirmReset() {
        if (confirm('本当にセーブデータを消去して最初からやり直しますか？')) {
            clearSave();
            resetGame();
        }
    }

    // UI更新関数
    function updateUI() {
        document.getElementById('money').innerText = state.money.toLocaleString();
        document.getElementById('eval').innerText = state.evaluation;
        document.getElementById('stock').innerText = state.stock;
        document.getElementById('customers').innerText = state.customers;
        
        const currentSpeed = Math.max(0.2, state.baseSpeed - (state.waitress * 0.2)).toFixed(1);
        document.getElementById('speed').innerText = currentSpeed;

        document.getElementById('partTimeCount').innerText = state.partTime;
        document.getElementById('waitressCount').innerText = state.waitress;
        document.getElementById('youtuberCount').innerText = state.youtuber;

        document.getElementById('btnBuyWaitress').disabled = state.waitress >= 25;
    }

    // ログ出力関数
    function log(message) {
        const logPanel = document.getElementById('log');
        const entry = document.createElement('div');
        entry.innerText = `> ${message}`;
        logPanel.appendChild(entry);
        logPanel.scrollTop = logPanel.scrollHeight;
    }

    // ゲームオーバー判定
    function checkGameOver() {
        if (state.money < 0) {
            alert('所持金がマイナスになりました。ゲームオーバー！最初からやり直します。');
            clearSave();
            resetGame();
            return true;
        }
        if (state.evaluation <= 0) {
            alert('評価が0になりました。ゲームオーバー！最初からやり直します。');
            clearSave();
            resetGame();
            return true;
        }
        return false;
    }

    // ゲームリセット
    function resetGame() {
        state = { ...INITIAL_STATE };
        document.getElementById('log').innerHTML = '';
        log('ゲームを初期化しました。');
        updateUI();
        restartCustomerTimer();
    }

    // ラーメン購入処理
    function buyRamen() {
        state.money -= 500;
        state.stock += 1;
        log('ラーメンを1食購入しました (-500円)');
        updateUI();
        if (!checkGameOver()) saveGame();
    }

    // バイト購入処理
    function buyPartTime() {
        if (state.money < 1000) {
            log('所持金が足りません！');
            return;
        }
        state.money -= 1000;
        state.partTime += 1;
        log('バイトを1人雇いました (-1,000円)');
        updateUI();
        if (!checkGameOver()) saveGame();
    }

    // 看板娘購入処理
    function buyWaitress() {
        if (state.waitress >= 25) {
            log('看板娘は25人が上限です！');
            return;
        }
        if (state.money < 2000) {
            log('所持金が足りません！');
            return;
        }
        state.money -= 2000;
        state.waitress += 1;
        log('看板娘を1人雇いました (-2,000円)');
        updateUI();
        restartCustomerTimer();
        if (!checkGameOver()) saveGame();
    }

    // YouTuber購入処理
    function buyYoutuber() {
        if (state.money < 20000) {
            log('所持金が足りません！');
            return;
        }
        state.money -= 20000;
        state.youtuber += 1;
        log('YouTuberを1人雇いました (-20,000円)');
        updateUI();
        if (!checkGameOver()) saveGame();
    }

    // 高速連打・長押し対応イベント登録関数（タッチの遅延やダブルタップブロックを回避）
    function setupRapidButton(elementId, actionFunc) {
        const btn = document.getElementById(elementId);
        let holdTimer = null;
        let isHolding = false;

        // タップ/クリック開始
        const startAction = (e) => {
            e.preventDefault();
            if (btn.disabled) return;
            actionFunc();

            // 押したままにした場合、少し待ってから連打（長押し連続購入）を発生させる
            isHolding = true;
            clearTimeout(holdTimer);
            holdTimer = setTimeout(() => {
                if (isHolding) {
                    holdInterval = setInterval(() => {
                        if (btn.disabled) {
                            stopAction();
                        } else {
                            actionFunc();
                        }
                    }, 100); // 0.1秒ごとに連続購入
                }
            }, 400); // 0.4秒長押しで自動連打スタート
        };

        let holdInterval = null;
        const stopAction = () => {
            isHolding = false;
            clearTimeout(holdTimer);
            clearInterval(holdInterval);
        };

        btn.addEventListener('touchstart', startAction, { passive: false });
        btn.addEventListener('touchend', stopAction);
        btn.addEventListener('touchcancel', stopAction);
        btn.addEventListener('mousedown', startAction);
        btn.addEventListener('mouseup', stopAction);
        btn.addEventListener('mouseleave', stopAction);
    }

    // 各ボタンに連打・長押し機能を適用
    setupRapidButton('btnBuyRamen', buyRamen);
    setupRapidButton('btnBuyPartTime', buyPartTime);
    setupRapidButton('btnBuyWaitress', buyWaitress);
    setupRapidButton('btnBuyYoutuber', buyYoutuber);

    // システムボタン
    document.getElementById('btnManualSave').addEventListener('click', manualSave);
    document.getElementById('btnConfirmReset').addEventListener('click', confirmReset);

    // 客の来店処理 (4秒ごとに来店＆自動セーブ)
    setInterval(() => {
        const incoming = Math.floor(Math.random() * 3) + 1;
        state.customers += incoming;
        updateUI();
        saveGame();
    }, 4000);

    // 接客・販売ループ
    function processCustomer() {
        if (state.customers > 0) {
            state.customers -= 1;

            if (state.stock > 0) {
                state.stock -= 1;
                let earnings = state.basePrice * Math.pow(1.3, state.partTime) * Math.pow(3, state.youtuber);
                earnings = Math.floor(earnings);
                
                state.money += earnings;
                log(`ラーメンが売れました！ (+${earnings.toLocaleString()}円)`);
            } else {
                state.evaluation -= 5;
                log('ラーメンの在庫がありません！ 評価が下がり(-5)');
            }
            updateUI();
            if (!checkGameOver()) saveGame();
        }
    }

    // タイマー設定関数
    function restartCustomerTimer() {
        if (gameLoopTimer) clearInterval(gameLoopTimer);
        
        const currentSpeedSeconds = Math.max(0.2, state.baseSpeed - (state.waitress * 0.2));
        const intervalMs = currentSpeedSeconds * 1000;
        
        gameLoopTimer = setInterval(processCustomer, intervalMs);
    }

    // ゲーム起動時の処理
    if (!loadGame()) {
        log('お店を開店しました！');
    }
    updateUI();
    restartCustomerTimer();
</script>

</body>
</html>
