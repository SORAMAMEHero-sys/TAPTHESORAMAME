<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進め！そらまめ軍団</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            user-select: none;
            touch-action: manipulation;
        }
        h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .author {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        .status-box {
            background: white;
            padding: 12px;
            border-radius: 10px;
            max-width: 320px;
            margin: 0 auto 15px auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .enemy-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 8px;
        }
        .hp-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            height: 18px;
            margin-bottom: 5px;
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background-color: #5cb85c;
            transition: width 0.1s;
        }
        #hp-text {
            font-size: 0.85rem;
            color: #333;
        }
        .info-panel {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #444;
            line-height: 1.4;
        }
        #attack-button {
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 50%;
            width: 150px;
            height: 150px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.1s;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        #attack-button:active {
            transform: scale(0.95);
            background-color: #e64a19;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .button-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .action-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 0.9rem;
            border-radius: 5px;
            cursor: pointer;
        }
        .action-btn:active {
            background-color: #0056b3;
        }
        .clear-container {
            margin-top: 50px;
        }
        .clear-container button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>進め！そらまめ軍団</h1>
    <div class="author">作者: そらまめゲームズ & Gemini</div>
    
    <div class="status-box">
        <div id="enemy-name" class="enemy-name">スライムが現れた！</div>
        <div class="hp-bar-container">
            <div id="hp-bar" class="hp-bar"></div>
        </div>
        <div id="hp-text">HP: 10 / 10</div>
    </div>

    <div class="info-panel">
        残り敵数: <span id="remaining-count">1000</span>体<br>
        コイン: <span id="coin-count">0</span>枚 | 攻撃力: <span id="attack-power">1</span>
    </div>
    
    <button id="attack-button">攻撃！</button>

    <div class="menu-buttons">
        <div class="button-row">
            <button class="action-btn" id="upgrade-button">攻撃力強化 (🪙<span id="upgrade-cost">3</span>)</button>
            <button class="action-btn" id="restart-button" style="background-color: #dc3545;">リスタート</button>
        </div>
        <div class="button-row">
            <button class="action-btn" id="skip-button" style="background-color: #6c757d;">クールダウン中 (スキップ: 🪙<span id="skip-cost">0</span>)</button>
        </div>
    </div>

    <script>
        // ゲームデータ（セーブ対象）
        let gameData = {
            enemiesRemaining: 1000,
            coins: 0,
            attackPower: 1,
            upgradeCost: 3,
            enemyMaxHp: 10,
            enemyHp: 10,
            defeatCount: 0,
            lastRestartTime: 0 // リスタートした時刻（ミリ秒）
        };

        const GOAL = 1000;
        const COOLDOWN_TIME = 15 * 60 * 1000; // 15分（ミリ秒）

        const normalEnemies = [
            { name: "スライム", hp: 10 },
            { name: "ゴブリン", hp: 25 },
            { name: "オオカミ", hp: 50 },
            { name: "魔物のおおきい鳥", hp: 100 },
            { name: "ドラゴン", hp: 250 }
        ];

        let lastDragonHp = 250;

        const enemyNameEl = document.getElementById('enemy-name');
        const hpBarEl = document.getElementById('hp-bar');
        const hpTextEl = document.getElementById('hp-text');
        const remainingCountEl = document.getElementById('remaining-count');
        const coinCountEl = document.getElementById('coin-count');
        const attackPowerEl = document.getElementById('attack-power');
        const upgradeCostEl = document.getElementById('upgrade-cost');
        const attackButton = document.getElementById('attack-button');
        const upgradeButton = document.getElementById('upgrade-button');
        const restartButton = document.getElementById('restart-button');
        const skipButton = document.getElementById('skip-button');
        const skipCostEl = document.getElementById('skip-cost');
        const body = document.body;

        function loadGame() {
            const saved = localStorage.getItem('soramame_save_v3');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    gameData = { ...gameData, ...parsed };
                } catch(e) {
                    console.log("セーブデータの読み込みに失敗しました");
                }
            }
        }

        function saveGame() {
            localStorage.setItem('soramame_save_v3', JSON.stringify(gameData));
        }

        function getCoinReward(remaining) {
            if (remaining > 950) return 1;
            if (remaining > 800) return 2;
            if (remaining > 700) return 3;
            if (remaining > 600) return 4;
            if (remaining > 500) return 5;
            if (remaining > 350) return 7;
            if (remaining > 100) return 10;
            return 15;
        }

        function getCurrentEnemyInfo(remaining) {
            if (remaining === 950) return { name: "【ボス】ダウナー", hp: lastDragonHp * 25 };
            if (remaining === 900) return { name: "【ボス】ダンビル", hp: lastDragonHp * 25 };
            if (remaining === 800) return { name: "【ボス】ダミルマッチャ", hp: lastDragonHp * 25 };
            if (remaining === 600) return { name: "【ボス】ロメンテヤシ", hp: lastDragonHp * 25 };
            if (remaining === 500) return { name: "【ボス】ソクラゼウス", hp: lastDragonHp * 75 };
            if (remaining === 350) return { name: "【ボス】ダウナー EX", hp: lastDragonHp * 70 };
            if (remaining === 100) return { name: "【ボス】終焉の支配者", hp: lastDragonHp * 100 };
            if (remaining === 50)  return { name: "【ボス】ラストビュオス", hp: lastDragonHp * 150 };
            if (remaining === 1)   return { name: "👑【ラスボス】そらまめ", hp: lastDragonHp * 250 };

            const index = gameData.defeatCount % normalEnemies.length;
            const baseEnemy = normalEnemies[index];
            
            if (index === 4) {
                lastDragonHp = baseEnemy.hp;
            }

            const groupLevel = Math.floor(gameData.defeatCount / 5);
            const scaledHp = Math.floor(baseEnemy.hp * Math.pow(1.5, groupLevel));

            return { name: baseEnemy.name, hp: scaledHp };
        }

        function updateScreen() {
            if (gameData.enemiesRemaining <= 0) {
                body.innerHTML = `
                    <div class="clear-container">
                        <h1>🎉 クリア！ 🎉</h1>
                        <p>おめでとう！<br>そらまめ軍団はすべての魔物を討伐し、平和を取り戻しました！</p>
                        <button onclick="localStorage.removeItem('soramame_save_v3'); location.reload();">最初から遊ぶ</button>
                    </div>
                `;
                return;
            }

            const currentEnemy = getCurrentEnemyInfo(gameData.enemiesRemaining);
            enemyNameEl.textContent = `${currentEnemy.name} を攻撃！`;

            if (!gameData.enemyMaxHp || gameData.enemyMaxHp <= 0) {
                gameData.enemyMaxHp = currentEnemy.hp;
                gameData.enemyHp = currentEnemy.hp;
            }

            let percentage = (gameData.enemyHp / gameData.enemyMaxHp) * 100;
            if (percentage < 0) percentage = 0;
            hpBarEl.style.width = percentage + "%";
            hpTextEl.textContent = `HP: ${gameData.enemyHp} / ${gameData.enemyMaxHp}`;
            
            remainingCountEl.textContent = gameData.enemiesRemaining;
            coinCountEl.textContent = gameData.coins;
            attackPowerEl.textContent = gameData.attackPower;
            upgradeCostEl.textContent = gameData.upgradeCost;

            // クールダウンとスキップコストの計算
            const now = Date.now();
            const elapsed = now - gameData.lastRestartTime;
            const skipCost = Math.round(gameData.attackPower * 1.5);
            skipCostEl.textContent = skipCost;

            if (elapsed < COOLDOWN_TIME) {
                const remainingTimeMs = COOLDOWN_TIME - elapsed;
                const remainingMinutes = Math.ceil(remainingTimeMs / (60 * 1000));
                restartButton.disabled = true;
                restartButton.style.opacity = "0.6";
                restartButton.textContent = `リスタート (${remainingMinutes}分後)`;
                
                skipButton.style.display = "inline-block";
            } else {
                restartButton.disabled = false;
                restartButton.style.opacity = "1";
                restartButton.textContent = "リスタート";
                
                skipButton.style.display = "none"; // クールダウン中でなければ非表示
            }
        }

        attackButton.addEventListener('click', () => {
            if (!gameData.enemyHp) {
                const currentEnemy = getCurrentEnemyInfo(gameData.enemiesRemaining);
                gameData.enemyMaxHp = currentEnemy.hp;
                gameData.enemyHp = currentEnemy.hp;
            }

            gameData.enemyHp -= gameData.attackPower;

            if (gameData.enemyHp <= 0) {
                gameData.coins += getCoinReward(gameData.enemiesRemaining);
                gameData.enemiesRemaining -= 1;
                gameData.defeatCount += 1;

                if (gameData.enemiesRemaining > 0) {
                    const nextEnemy = getCurrentEnemyInfo(gameData.enemiesRemaining);
                    gameData.enemyMaxHp = nextEnemy.hp;
                    gameData.enemyHp = nextEnemy.hp;
                }
            }

            saveGame();
            updateScreen();
        });

        upgradeButton.addEventListener('click', () => {
            if (gameData.coins >= gameData.upgradeCost) {
                gameData.coins -= gameData.upgradeCost;
                gameData.attackPower *= 2;
                gameData.upgradeCost *= 3;
                saveGame();
                updateScreen();
            } else {
                alert("コインが足りません！");
            }
        });

        // リスタートボタン
        restartButton.addEventListener('click', () => {
            const now = Date.now();
            if (now - gameData.lastRestartTime < COOLDOWN_TIME) {
                alert("まだクールダウン中です！");
                return;
            }

            if (confirm("残りの敵を1000体にリセットしますか？（コインや攻撃力はそのまま引き継がれます。次回から15分間のクールダウンが発生します）")) {
                gameData.enemiesRemaining = 1000;
                gameData.defeatCount = 0;
                const firstEnemy = getCurrentEnemyInfo(1000);
                gameData.enemyMaxHp = firstEnemy.hp;
                gameData.enemyHp = firstEnemy.hp;
                gameData.lastRestartTime = Date.now(); // 現在時刻を記録
                saveGame();
                updateScreen();
            }
        });

        // クールダウンスキップボタン
        skipButton.addEventListener('click', () => {
            const skipCost = Math.round(gameData.attackPower * 1.5);
            if (gameData.coins >= skipCost) {
                if (confirm(`🪙${skipCost}枚を支払ってクールダウンをスキップしますか？`)) {
                    gameData.coins -= skipCost;
                    gameData.lastRestartTime = 0; // タイマーをリセットして即座にリスタート可能にする
                    saveGame();
                    updateScreen();
                    alert("クールダウンをスキップしました！");
                }
            } else {
                alert("コインが足りません！");
            }
        });

        loadGame();
        const currentEnemy = getCurrentEnemyInfo(gameData.enemiesRemaining);
        if (!gameData.enemyHp || gameData.enemyHp > currentEnemy.hp) {
            gameData.enemyMaxHp = currentEnemy.hp;
            gameData.enemyHp = currentEnemy.hp;
        }
        
        // 1秒ごとに画面を更新してクールダウンの残り時間をリアルタイム反映
        setInterval(updateScreen, 1000);

        updateScreen();
    </script>

</body>
</html>
