<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進め！そらまめ軍団</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 15px; user-select: none; touch-action: manipulation; }
        h1 { color: #333; font-size: 1.4rem; margin-bottom: 2px; }
        .header-area { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 10px; }
        .author { color: #666; font-size: 0.8rem; margin: 0; }
        .hard-reset-btn { background-color: #343a40; color: #ff6b6b; border: 1px solid #ff6b6b; padding: 2px 6px; font-size: 0.7rem; border-radius: 4px; cursor: pointer; }
        .status-box { background: white; padding: 10px; border-radius: 10px; max-width: 320px; margin: 0 auto 10px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .enemy-name { font-size: 1.1rem; font-weight: bold; color: #d9534f; margin-bottom: 6px; }
        .hp-bar-container { width: 100%; background-color: #e0e0e0; border-radius: 10px; overflow: hidden; height: 16px; margin-bottom: 4px; }
        .hp-bar { width: 100%; height: 100%; background-color: #5cb85c; transition: width 0.1s; }
        #attack-button { background-color: #ff5722; color: white; border: none; border-radius: 50%; width: 130px; height: 130px; font-size: 1.3rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin: 0 auto 10px auto; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
        #attack-button:active { transform: scale(0.95); background-color: #e64a19; }
        .action-btn { background-color: #007bff; color: white; border: none; padding: 8px 12px; font-size: 0.85rem; border-radius: 5px; cursor: pointer; margin: 3px; }
        .section-box { background: white; padding: 10px; border-radius: 10px; max-width: 320px; margin: 0 auto 10px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .admin-panel { background: #343a40; color: white; border: 2px dashed #ffc107; display: none; margin-bottom: 10px; }
        .admin-btn { background-color: #ffc107; color: #000; font-weight: bold; border: none; padding: 6px 10px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; margin: 2px; }
    </style>
</head>
<body>

    <h1>進め！そらまめ軍団</h1>
    <div class="header-area">
        <div class="author">作者: そらまめゲームズ</div>
        <button class="hard-reset-btn" onclick="hardReset()">完全初期化</button>
    </div>
    
    <div class="status-box">
        <div id="enemy-name" class="enemy-name">スライムが現れた！</div>
        <div class="hp-bar-container"><div id="hp-bar" class="hp-bar"></div></div>
        <div id="hp-text">HP: 10 / 10</div>
    </div>

    <button id="attack-button">攻撃！</button>

    <div class="section-box admin-panel" id="admin-panel">
        <h3>⚙️ 管理者パネル</h3>
        <button class="admin-btn" onclick="adminAddCoins()">🪙 1億コイン</button>
        <button class="admin-btn" onclick="adminAddRubies()">💎 100ルビー</button>
        <button class="admin-btn" onclick="adminKillEnemy()">💥 一撃撃破</button>
    </div>

    <script>
        const SAVE_KEY = 'soramame_save_v9';
        let gameData = { enemiesRemaining: 1000, coins: 0, rubies: 0, attackPower: 1, defeatCount: 0, enemyHp: 10, enemyMaxHp: 10 };

        // 管理者パネル表示判定
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('soramame_admin') === 'true') {
            document.getElementById('admin-panel').style.display = 'block';
        }

        function getCurrentEnemyInfo(remaining) {
            // ボス倍率設定
            if (remaining === 950) return { name: "【ボス】ダウナー", hp: 18000, isBoss: true }; // 3000*6
            if (remaining === 900) return { name: "【ボス】ダンビル", hp: 32000, isBoss: true }; // 8000*4
            if (remaining === 800) return { name: "【ボス】ダミルマッチャ", hp: 50000, isBoss: true }; // 20000*2.5
            if (remaining === 600) return { name: "【ボス】ロメンテヤシ", hp: 120000, isBoss: true }; // 60000*2
            if (remaining === 500) return { name: "【ボス】ソクラゼウス", hp: 150000, isBoss: true }; // そのまま
            
            return { name: "敵", hp: 10 + (Math.floor(gameData.defeatCount/5)*250), isBoss: false };
        }

        function hardReset() {
            if(confirm("データを初期化しますか？")) { localStorage.clear(); location.reload(); }
        }

        function performAttack() {
            gameData.enemyHp -= gameData.attackPower;
            if (gameData.enemyHp <= 0) {
                gameData.enemiesRemaining--;
                gameData.defeatCount++;
                const next = getCurrentEnemyInfo(gameData.enemiesRemaining);
                gameData.enemyMaxHp = next.hp;
                gameData.enemyHp = next.hp;
            }
            updateUI();
        }

        function updateUI() {
            const current = getCurrentEnemyInfo(gameData.enemiesRemaining);
            document.getElementById('enemy-name').textContent = current.name;
            document.getElementById('hp-text').textContent = `HP: ${gameData.enemyHp} / ${gameData.enemyMaxHp}`;
            document.getElementById('hp-bar').style.width = (gameData.enemyHp / gameData.enemyMaxHp * 100) + "%";
        }

        // 管理者機能
        window.adminAddCoins = () => { gameData.coins += 100000000; updateUI(); };
        window.adminAddRubies = () => { gameData.rubies += 100; updateUI(); };
        window.adminKillEnemy = () => { gameData.enemyHp = 0; performAttack(); };

        document.getElementById('attack-button').addEventListener('click', performAttack);
        updateUI();
    </script>
</body>
</html>
